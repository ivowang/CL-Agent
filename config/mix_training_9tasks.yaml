# Mix Training Configuration (9-task pool)
#
# This config enables multi-task mixed training where the agent trains on a
# user-selected subset of the 9 environments simultaneously in each batch.
# Each parallel sampling step includes samples from the selected environments.
#
# Environments:
#   BanditLow, BanditMedium, BanditHard
#   SokobanLow, SokobanMedium, SokobanHard
#   FrozenLakeLow, FrozenLakeMedium, FrozenLakeHard
#
# Key features:
# - Selected environments are mixed in each training batch
# - Single shared LoRA module for all environments
# - No sequential task ordering
# - Each batch contains samples from the selected tasks/difficulties
#
# Checkpoint structure:
#   checkpoints/mix_9tasks/{timestamp}/global_step_{N}/
#
# Usage:
#   python train_scripts/train_mix.py --config-name mix_training_9tasks
#   or
#   bash runs/run_mix.sh
#
# With custom parameters:
#   TOTAL_STEPS=1200 TEST_FREQ=20 bash runs/run_mix.sh
#   MIX_TASKS=BanditLow,BanditMedium,BanditHard bash runs/run_mix.sh

defaults:
  - base
  - _self_

# Override base settings for mix training
trainer:
  project_name: ragen_mix_training_9tasks
  experiment_name: mix_9tasks
  total_training_steps: 1200  # Adjust if using a smaller/larger task subset
  test_freq: 20  # Validate every 20 steps on all environments
  save_freq: 100  # Save checkpoint every 100 steps
  val_before_train: True
  generations_to_log_to_wandb:
    val: 20
  logger: ['console', 'wandb']
  max_actor_ckpt_to_keep: 5
  max_critic_ckpt_to_keep: 5
  resume_mode: disable
  default_local_dir: checkpoints/mix_9tasks

# Mix training specific settings
mix_training:
  # Method name (for logging)
  method_name: mix_9tasks

  # Task subset to mix in each training batch (defaults to Bandit difficulties)
  # Available tasks: BanditLow, BanditMedium, BanditHard,
  #                  SokobanLow, SokobanMedium, SokobanHard,
  #                  FrozenLakeLow, FrozenLakeMedium, FrozenLakeHard
  task_subset:
    - BanditLow
    - BanditMedium
    - BanditHard

  # List of 9 environments to mix in each training batch
  # All environments are sampled simultaneously in each step
  # n_groups determines how many groups of each environment type per batch
  environments:
    # Bandit environments (3 difficulty levels)
    - name: bandit_low
      train_tags: ["BanditLow"]
      train_n_groups: [2]         # 2 groups × 16 = 32 samples per batch
      val_tags: ["BanditLowVal"]
      val_n_groups: [32]

    - name: bandit_medium
      train_tags: ["BanditMedium"]
      train_n_groups: [2]
      val_tags: ["BanditMediumVal"]
      val_n_groups: [32]

    - name: bandit_hard
      train_tags: ["BanditHard"]
      train_n_groups: [2]
      val_tags: ["BanditHardVal"]
      val_n_groups: [32]

    # Sokoban environments (3 difficulty levels)
    - name: sokoban_low
      train_tags: ["SokobanLow"]
      train_n_groups: [2]
      val_tags: ["SokobanLow"]
      val_n_groups: [32]

    - name: sokoban_medium
      train_tags: ["SokobanMedium"]
      train_n_groups: [2]
      val_tags: ["SokobanMedium"]
      val_n_groups: [32]

    - name: sokoban_hard
      train_tags: ["SokobanHard"]
      train_n_groups: [2]
      val_tags: ["SokobanHard"]
      val_n_groups: [32]

    # Frozen Lake environments (3 difficulty levels)
    - name: frozen_lake_low
      train_tags: ["FrozenLakeLow"]
      train_n_groups: [2]
      val_tags: ["FrozenLakeLow"]
      val_n_groups: [32]

    - name: frozen_lake_medium
      train_tags: ["FrozenLakeMedium"]
      train_n_groups: [2]
      val_tags: ["FrozenLakeMedium"]
      val_n_groups: [32]

    - name: frozen_lake_hard
      train_tags: ["FrozenLakeHard"]
      train_n_groups: [2]
      val_tags: ["FrozenLakeHard"]
      val_n_groups: [32]

  # Total per batch depends on task_subset and n_groups (e.g., 3 envs × 2 groups).

# Agent proxy settings
agent_proxy:
  max_turn: 5
  max_actions_per_turn: 2

# ES Manager settings (initial placeholder, overridden to match the selected subset)
# The actual mixed config is built dynamically in mix_trainer.py
es_manager:
  train:
    env_groups: 18              # Placeholder; overridden based on task_subset
    group_size: 8
    env_configs:
      tags: ["BanditLow", "BanditMedium", "BanditHard", "SokobanLow", "SokobanMedium", "SokobanHard", "FrozenLakeLow", "FrozenLakeMedium", "FrozenLakeHard"]
      n_groups: [2, 2, 2, 2, 2, 2, 2, 2, 2]
  val:
    env_groups: 32
    group_size: 8
    env_configs:
      tags: ["BanditLowVal"]    # Validation done separately per env
      n_groups: [32]

# Rollout settings
actor_rollout_ref:
  rollout:
    response_length: 500
    # Lower GPU memory utilization to be safe with multi-env switching
    gpu_memory_utilization: 0.5
    val_kwargs:
      do_sample: True
      temperature: 0.5
