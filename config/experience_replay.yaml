# Experience Replay (ER) Configuration for RAGEN (9-task benchmark).
#
# This config reuses Mix Training benchmark settings while enabling
# in-context experience replay without parameter updates.
#
# Usage:
#   python train_scripts/train_er.py --config-name experience_replay
#   or
#   ENV_TAG=BanditLow bash runs/run_er.sh

defaults:
  - mix_training_9tasks
  - _self_

# Override base settings for Experience Replay
trainer:
  project_name: ragen_experience_replay_9tasks
  experiment_name: er_9tasks
  total_training_steps: 1000  # Not used directly; ER stops when buffer is full
  test_freq: 1  # Validation handled by ER method
  save_freq: 1000
  val_before_train: False  # ER handles its own initial validation
  generations_to_log_to_wandb:
    val: 20
  logger: ['console', 'wandb']
  resume_mode: disable

# Experience Replay specific settings
experience_replay:
  # Environment to train on (9-task benchmark tags)
  env_tag: BanditLow

  # Buffer settings
  buffer_size: 20  # N: Maximum successful rollouts to collect

  # Output settings
  output_dir: results/experience_replay

# Agent proxy settings
agent_proxy:
  max_turn: 10
  max_actions_per_turn: 5

# ES Manager settings - will be dynamically set based on env_tag
es_manager:
  train:
    env_groups: 18  # Placeholder; overridden using mix_training environments
    group_size: 8
    env_configs:
      tags: ["BanditLow"]
      n_groups: [2]
  val:
    env_groups: 32
    group_size: 8
    env_configs:
      tags: ["BanditLowVal"]
      n_groups: [32]
