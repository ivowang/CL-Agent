# SD-LoRA Continual Learning Configuration for RAGEN
#
# This config enables sequential training using SD-LoRA (Scalable Decomposed Low-Rank Adaptation)
# which learns each task with separate LoRA adapters and uses learnable scaling factors
# to combine them during inference.
#
# Checkpoint structure:
#   checkpoints/sdlora/{timestamp}/global_step_{N}/
#
# Usage:
#   python train_continual.py --config-name continual_learning_sdlora
#   or
#   bash run_continual_sdlora.sh
#
# Resume from checkpoint:
#   python train_continual.py --config-name continual_learning_sdlora \
#       continual_learning.resume_checkpoint=/path/to/checkpoint

defaults:
  - base
  - _self_

# Override base settings for SD-LoRA continual learning
trainer:
  project_name: ragen_continual_learning
  experiment_name: cl_sdlora
  total_training_steps: 200  # Will be overridden per task
  test_freq: 10  # Validate every 10 steps on all seen tasks
  save_freq: 200  # Save checkpoint at end of each task
  val_before_train: True
  generations_to_log_to_wandb:
    val: 20
  logger: ['console', 'wandb']
  max_actor_ckpt_to_keep: 5
  max_critic_ckpt_to_keep: 5
  resume_mode: disable

# Continual Learning specific settings
continual_learning:
  experiment_name: cl_sdlora

  # Base directory for checkpoints
  # Actual path: {checkpoint_base_dir}/sdlora/{timestamp}/
  checkpoint_base_dir: checkpoints

  steps_per_task: 200

  # Resume from checkpoint (optional)
  # If not set, training starts from scratch
  # If set, training resumes from the checkpoint and continues to the next task
  # The task is determined by: global_step // steps_per_task
  resume_checkpoint: null

  # Task order (optional)
  # Use a string of indices to specify the training order of tasks
  # Examples:
  #   "012" - Default order: Bandit -> Sokoban -> Frozen Lake
  #   "102" - Order: Sokoban -> Bandit -> Frozen Lake
  #   "210" - Order: Frozen Lake -> Sokoban -> Bandit
  # If not set or null, uses default order (same as "012")
  task_order: null

  # CL Method configuration
  method:
    name: sdlora
    # SD-LoRA specific parameters
    scaling_factor_init: 0.8  # Initial value for scaling factors
    normalize_lora: true      # Whether to normalize LoRA outputs by weight norms
    lora_rank: 64             # LoRA rank per task

  # Tasks to train sequentially (order can be changed via task_order)
  tasks:
    - name: bandit
      train_tags: ["Bandit"]
      train_n_groups: [8]
      val_tags: ["Bandit"]
      val_n_groups: [32]

    - name: sokoban
      train_tags: ["CoordSokoban"]
      train_n_groups: [8]
      val_tags: ["CoordSokoban"]
      val_n_groups: [32]

    - name: frozen_lake
      train_tags: ["CoordFrozenLake"]
      train_n_groups: [8]
      val_tags: ["CoordFrozenLake"]
      val_n_groups: [32]

# Agent proxy settings
agent_proxy:
  max_turn: 10
  max_actions_per_turn: 5

# ES Manager settings (will be overridden per task dynamically)
es_manager:
  train:
    env_groups: 8
    group_size: 16
    env_configs:
      tags: ["Bandit"]
      n_groups: [8]
  val:
    env_groups: 32
    group_size: 16
    env_configs:
      tags: ["Bandit"]
      n_groups: [32]

# Rollout settings
actor_rollout_ref:
  rollout:
    response_length: 500
    # Lower GPU memory utilization to avoid conflicts with CL computation
    gpu_memory_utilization: 0.4
    val_kwargs:
      do_sample: True
      temperature: 0.5
