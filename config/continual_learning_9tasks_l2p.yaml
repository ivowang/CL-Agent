# 9-Task L2P Continual Learning Configuration
#
# This config enables sequential training using L2P (Learning to Prompt)
# on 9 tasks (3 environments × 3 difficulty levels), using a prompt pool
# with instance-wise selection and a pull constraint loss.
#
# Task Index Mapping:
#   0=BanditLow, 1=BanditMedium, 2=BanditHard
#   3=SokobanLow, 4=SokobanMedium, 5=SokobanHard
#   6=FrozenLakeLow, 7=FrozenLakeMedium, 8=FrozenLakeHard
#
# Checkpoint structure:
#   checkpoints/l2p_9tasks/{timestamp}/global_step_{N}/
#
# Usage:
#   python train_continual.py --config-name continual_learning_9tasks_l2p
#   or
#   bash run_continual_9tasks_l2p.sh

defaults:
  - base
  - _self_

# System settings
system:
  CUDA_VISIBLE_DEVICES: "0"  # Single GPU for L2P

# Training batch sizing (increase GPU utilization for HF rollout)
micro_batch_size_per_gpu: 8

# Override base settings for L2P continual learning
trainer:
  project_name: ragen_continual_learning_9tasks
  experiment_name: cl_l2p_9tasks
  n_gpus_per_node: 1  # Single GPU
  total_training_steps: 900  # Will be overridden per task
  test_freq: 20  # Validate every 20 steps on all seen tasks
  save_freq: 100  # Save checkpoint at end of each task
  val_before_train: True
  generations_to_log_to_wandb:
    val: 20
  logger: ['console', 'wandb']
  max_actor_ckpt_to_keep: 9
  max_critic_ckpt_to_keep: 9
  resume_mode: disable

# Use HF rollout to support prompt injection
actor_rollout_ref:
  rollout:
    name: hf
    micro_batch_size: 32
  model:
    lora_rank: 0
    lora_alpha: 1
    enable_gradient_checkpointing: false
    l2p:
      enable: true
      pool_size: ${continual_learning.method.pool_size}
      prompt_length: ${continual_learning.method.prompt_length}
      top_k: ${continual_learning.method.top_k}
      embedding_key: ${continual_learning.method.embedding_key}
      prompt_init: ${continual_learning.method.prompt_init}
      prompt_key: ${continual_learning.method.prompt_key}
      prompt_key_init: ${continual_learning.method.prompt_key_init}
      use_prompt_mask: ${continual_learning.method.use_prompt_mask}

# Continual Learning specific settings
continual_learning:
  experiment_name: cl_l2p_9tasks

  # Base directory for checkpoints
  checkpoint_base_dir: checkpoints

  steps_per_task: 100

  # Resume from checkpoint (optional)
  resume_checkpoint: null

  # Task order (optional) - 9-digit string
  task_order: null

  # CL Method configuration
  method:
    name: l2p
    pool_size: 36
    prompt_length: 10
    top_k: 4
    embedding_key: mean  # mean | max | mean_max | cls
    prompt_init: uniform
    prompt_key: true
    prompt_key_init: uniform
    use_prompt_mask: true
    pull_constraint_coeff: 1.0

  # 9 Tasks: 3 environments × 3 difficulty levels
  tasks:
    # Task 0: Bandit Low
    - name: bandit_low
      train_tags: ["BanditLow"]
      train_n_groups: [8]
      val_tags: ["BanditLowVal"]
      val_n_groups: [32]

    # Task 1: Bandit Medium
    - name: bandit_medium
      train_tags: ["BanditMedium"]
      train_n_groups: [8]
      val_tags: ["BanditMediumVal"]
      val_n_groups: [32]

    # Task 2: Bandit Hard
    - name: bandit_hard
      train_tags: ["BanditHard"]
      train_n_groups: [8]
      val_tags: ["BanditHardVal"]
      val_n_groups: [32]

    # Task 3: Sokoban Low
    - name: sokoban_low
      train_tags: ["SokobanLow"]
      train_n_groups: [8]
      val_tags: ["SokobanLow"]
      val_n_groups: [32]

    # Task 4: Sokoban Medium
    - name: sokoban_medium
      train_tags: ["SokobanMedium"]
      train_n_groups: [8]
      val_tags: ["SokobanMedium"]
      val_n_groups: [32]

    # Task 5: Sokoban Hard
    - name: sokoban_hard
      train_tags: ["SokobanHard"]
      train_n_groups: [8]
      val_tags: ["SokobanHard"]
      val_n_groups: [32]

    # Task 6: Frozen Lake Low
    - name: frozen_lake_low
      train_tags: ["FrozenLakeLow"]
      train_n_groups: [8]
      val_tags: ["FrozenLakeLow"]
      val_n_groups: [32]

    # Task 7: Frozen Lake Medium
    - name: frozen_lake_medium
      train_tags: ["FrozenLakeMedium"]
      train_n_groups: [8]
      val_tags: ["FrozenLakeMedium"]
      val_n_groups: [32]

    # Task 8: Frozen Lake Hard
    - name: frozen_lake_hard
      train_tags: ["FrozenLakeHard"]
      train_n_groups: [8]
      val_tags: ["FrozenLakeHard"]
      val_n_groups: [32]

# Agent proxy settings
agent_proxy:
  max_turn: 5
  max_actions_per_turn: 2

# ES Manager settings (will be overridden per task dynamically)
es_manager:
  train:
    env_groups: 8
    group_size: 16
    env_configs:
      tags: ["BanditLow"]
      n_groups: [8]
  val:
    env_groups: 32
