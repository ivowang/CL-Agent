# 9-Task HiDE-Prompt Continual Learning Configuration
#
# This config enables sequential training using HiDE-Prompt (Hierarchical Decomposition
# of Prompt-Based Continual Learning) on 9 tasks (3 environments × 3 difficulty levels),
# using task-specific prompts with contrastive regularization to minimize catastrophic forgetting.
#
# Task Index Mapping:
#   0=BanditLow, 1=BanditMedium, 2=BanditHard
#   3=SokobanLow, 4=SokobanMedium, 5=SokobanHard
#   6=FrozenLakeLow, 7=FrozenLakeMedium, 8=FrozenLakeHard
#
# Predefined Task Orderings:
#   Order 1: "012345678" - Env-first, LMH: BL→BM→BH→SL→SM→SH→FL→FM→FH
#   Order 2: "210543876" - Env-first, HML: BH→BM→BL→SH→SM→SL→FH→FM→FL
#   Order 3: "036147258" - Difficulty-first, LMH: BL→SL→FL→BM→SM→FM→BH→SH→FH
#   Order 4: "258147036" - Difficulty-first, HML: BH→SH→FH→BM→SM→FM→BL→SL→FL
#
# Checkpoint structure:
#   checkpoints/hideprompt_9tasks/{timestamp}/global_step_{N}/
#
# Usage:
#   python train_continual.py --config-name continual_learning_9tasks_hideprompt
#   or
#   bash run_continual_9tasks_hideprompt.sh
#
# With custom parameters:
#   REG_WEIGHT=0.1 PROMPT_LENGTH=5 bash run_continual_9tasks_hideprompt.sh

defaults:
  - base
  - _self_

# System settings
system:
  CUDA_VISIBLE_DEVICES: "0"  # Single GPU for HiDE-Prompt

# Override base settings for HiDE-Prompt continual learning
trainer:
  project_name: ragen_continual_learning_9tasks
  experiment_name: cl_hideprompt_9tasks
  n_gpus_per_node: 1  # Single GPU
  total_training_steps: 900  # Will be overridden per task
  test_freq: 20  # Validate every 20 steps on all seen tasks
  save_freq: 100  # Save checkpoint at end of each task
  val_before_train: True
  generations_to_log_to_wandb:
    val: 20
  logger: ['console', 'wandb']
  max_actor_ckpt_to_keep: 9
  max_critic_ckpt_to_keep: 9
  resume_mode: disable

# Continual Learning specific settings
continual_learning:
  experiment_name: cl_hideprompt_9tasks

  # Base directory for checkpoints
  checkpoint_base_dir: checkpoints

  steps_per_task: 100

  # Resume from checkpoint (optional)
  resume_checkpoint: null

  # Task order (optional) - 9-digit string
  task_order: null

  # CL Method configuration
  method:
    name: hideprompt
    # HiDE-Prompt specific parameters
    prompt_length: 5          # Length of each task-specific prompt
    prompt_init: uniform      # Initialization method ('uniform' or 'zero')
    prompt_momentum: 0.01     # Momentum for prompt averaging (0.0 = no momentum)
    reg_weight: 0.1           # Weight for contrastive regularization loss
    temperature: 0.8          # Temperature for contrastive loss
    storage_method: multi-centroid  # 'variance', 'covariance', or 'multi-centroid'
    n_centroids: 10           # Number of centroids for multi-centroid method
    extract_layer: last       # Which layer to extract features from

  # 9 Tasks: 3 environments × 3 difficulty levels
  tasks:
    # Task 0: Bandit Low
    - name: bandit_low
      train_tags: ["BanditLow"]
      train_n_groups: [8]
      val_tags: ["BanditLowVal"]
      val_n_groups: [32]

    # Task 1: Bandit Medium
    - name: bandit_medium
      train_tags: ["BanditMedium"]
      train_n_groups: [8]
      val_tags: ["BanditMediumVal"]
      val_n_groups: [32]

    # Task 2: Bandit Hard
    - name: bandit_hard
      train_tags: ["BanditHard"]
      train_n_groups: [8]
      val_tags: ["BanditHardVal"]
      val_n_groups: [32]

    # Task 3: Sokoban Low
    - name: sokoban_low
      train_tags: ["SokobanLow"]
      train_n_groups: [8]
      val_tags: ["SokobanLow"]
      val_n_groups: [32]

    # Task 4: Sokoban Medium
    - name: sokoban_medium
      train_tags: ["SokobanMedium"]
      train_n_groups: [8]
      val_tags: ["SokobanMedium"]
      val_n_groups: [32]

    # Task 5: Sokoban Hard
    - name: sokoban_hard
      train_tags: ["SokobanHard"]
      train_n_groups: [8]
      val_tags: ["SokobanHard"]
      val_n_groups: [32]

    # Task 6: Frozen Lake Low
    - name: frozen_lake_low
      train_tags: ["FrozenLakeLow"]
      train_n_groups: [8]
      val_tags: ["FrozenLakeLow"]
      val_n_groups: [32]

    # Task 7: Frozen Lake Medium
    - name: frozen_lake_medium
      train_tags: ["FrozenLakeMedium"]
      train_n_groups: [8]
      val_tags: ["FrozenLakeMedium"]
      val_n_groups: [32]

    # Task 8: Frozen Lake Hard
    - name: frozen_lake_hard
      train_tags: ["FrozenLakeHard"]
      train_n_groups: [8]
      val_tags: ["FrozenLakeHard"]
      val_n_groups: [32]

# Agent proxy settings
agent_proxy:
  max_turn: 5
  max_actions_per_turn: 2

# ES Manager settings (will be overridden per task dynamically)
es_manager:
  train:
    env_groups: 8
    group_size: 16
    env_configs:
      tags: ["BanditLow"]
      n_groups: [8]
  val:
    env_groups: 32
    group_size: 16
    env_configs:
      tags: ["BanditLowVal"]
      n_groups: [32]

# Rollout settings
actor_rollout_ref:
  rollout:
    response_length: 500
    # Lower GPU memory utilization to avoid conflicts with CL loss computation
    gpu_memory_utilization: 0.4
    val_kwargs:
      do_sample: True
      temperature: 0.5
